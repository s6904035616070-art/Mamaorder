<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านมาม่า สั่งอาหารผ่าน QR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F8F4;--card:#fff;--ink:#1D2B26;--mute:#5F6F68;--line:#DCE3DD;--green:#2F6B4F;--red:#C8322B;--lime:#E4EFA6;--amber:#D9A400}
@media (prefers-color-scheme:dark){:root{--bg:#121A16;--card:#1B2620;--ink:#EAF1EC;--mute:#9DB0A5;--line:#2C3B33;--green:#6FBF94;--red:#F0786F;--lime:#3B4A1E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.mute{color:var(--mute)}
.cats{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px}
.chip,.acts button,.qty button,.login button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip{padding:8px 14px;border-radius:99px;white-space:nowrap}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.emo{font-size:32px;width:52px;height:52px;display:grid;place-items:center;background:var(--lime);border-radius:12px}
.grow{flex:1}.n{font-weight:600}.p{color:var(--mute);font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;font-size:20px}
.qty .add{background:var(--green);color:#fff;border-color:var(--green)}
textarea,input{width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.send{display:block;width:100%;max-width:528px;margin:0 auto;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.send:disabled{opacity:.4}
.ok,.err{border-radius:14px;padding:14px;margin-top:12px}.ok{background:var(--lime)}.err{background:var(--red);color:#fff}
.order{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:14px;padding:12px;margin-top:10px}
.order.making{border-left-color:var(--amber)}.order.done{border-left-color:var(--green);opacity:.65}
.order h3{margin:0 0 4px;font-size:18px}.order ul{margin:6px 0;padding-left:20px}.note{color:var(--red);font-weight:600}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:8px;border-radius:10px}
.login button{width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--green);color:#fff;font-weight:800}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><button class="send" id="send" disabled>ส่งออเดอร์</button></div>

<script>
// ===== ใส่ค่าจาก Supabase (Project Settings > API) =====
var SUPABASE_URL = "https://gtwejbpworqvxehokwuk.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0d2VqYnB3b3JxdnhlaG9rd3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjIwNjUsImV4cCI6MjEwNjIzODA2NX0.D5LtgiFa4aVSEuuft4oX7hLJEH-5hv9-oQ4uJSc_tkQ";
// ======================================================

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var params = new URLSearchParams(location.search);
var app = document.getElementById("app");
var bar = document.getElementById("bar");
var sendBtn = document.getElementById("send");

function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function btn(t, f, cls){var b=el("button",cls,t);b.onclick=f;return b}

if (params.get("view") === "kitchen") kitchenPage(); else customerPage();

/* ---------- หน้าลูกค้า (QR: ?table=5) ---------- */
async function customerPage(){
  var table = parseInt(params.get("table"), 10);
  var menu = [], cart = {}, cat = null;
  app.appendChild(el("p","mute","กำลังโหลดเมนู..."));

  var r = await sb.from("menu_items").select("*").eq("available", true).order("id");
  app.textContent = "";
  if (r.error) { app.appendChild(el("div","err","โหลดเมนูไม่ได้ ตรวจ URL และ key ในไฟล์ index.html")); return; }
  menu = r.data;
  var cats = menu.map(function(m){return m.category}).filter(function(c,i,a){return a.indexOf(c)===i});
  cat = cats[0];

  var top = el("div","top"); top.appendChild(el("h1",null,"ร้านมาม่า"));
  var sel = el("select");
sel.style.cssText = "font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)";
var ph = el("option", null, "เลือกโต๊ะ"); ph.value = ""; sel.appendChild(ph);
for (var i = 1; i <= 20; i++) { var o = el("option", null, "โต๊ะ " + i); o.value = i; sel.appendChild(o); }
if (table >= 1 && table <= 20) sel.value = table;
sel.onchange = function(){ table = parseInt(sel.value, 10) || NaN; draw(); };
top.appendChild(sel);

  var catsEl = el("div","cats"), menuEl = el("div"), note = el("textarea");
  note.rows = 2; note.placeholder = "หมายเหตุถึงครัว เช่น ไม่เผ็ด, เส้นนิ่ม";
  var msg = el("div");
  app.append(top, catsEl, menuEl, note, msg);
  bar.hidden = false;

  function draw(){
    catsEl.textContent = ""; menuEl.textContent = "";
    cats.forEach(function(c){catsEl.appendChild(btn(c,function(){cat=c;draw()},"chip"+(c===cat?" on":"")))});
    menu.filter(function(m){return m.category===cat}).forEach(function(m){
      var q = cart[m.id]||0, row = el("div","item"), g = el("div","grow"), qty = el("div","qty");
      g.append(el("div","n",m.name), el("div","p",m.price+" บาท"));
      if (q>0) { qty.appendChild(btn("−",function(){cart[m.id]--;draw()})); qty.appendChild(el("b",null,q)); }
      qty.appendChild(btn("+",function(){cart[m.id]=(cart[m.id]||0)+1;draw()},"add"));
      row.append(el("div","emo",m.emoji||"🍽️"), g, qty); menuEl.appendChild(row);
    });
    var n=0,t=0; menu.forEach(function(m){var q=cart[m.id]||0;n+=q;t+=q*m.price});
    sendBtn.disabled = n===0 || !table;
    sendBtn.textContent = !table ? "สแกน QR ที่โต๊ะอีกครั้ง" : n ? "ส่งออเดอร์ · "+n+" รายการ · "+t+" บาท" : "เลือกอาหารก่อนนะ";
  }
  sendBtn.onclick = async function(){
    var items = menu.filter(function(m){return cart[m.id]}).map(function(m){return {name:m.name,qty:cart[m.id],price:m.price}});
    sendBtn.disabled = true;
    var res = await sb.from("orders").insert({table_no:table, items:items, note:note.value.trim()||null});
    if (res.error) { msg.className="err"; msg.textContent="ส่งไม่สำเร็จ ลองอีกครั้ง หรือเรียกพนักงาน"; draw(); return; }
    cart = {}; note.value = ""; draw();
    msg.className = "ok"; msg.textContent = "ส่งออเดอร์โต๊ะ " + table + " ให้ครัวแล้ว รอสักครู่นะ";
    setTimeout(function(){msg.className="";msg.textContent=""}, 8000);
  };
  draw();
}

/* ---------- หน้าครัว (?view=kitchen) ---------- */
async function kitchenPage(){
  var s = await sb.auth.getSession();
  if (s.data.session) kitchenBoard(); else loginForm();
}
function loginForm(){
  app.textContent = "";
  var box = el("div","login"), em = el("input"), pw = el("input"), msg = el("div");
  em.type="email"; em.placeholder="อีเมล"; pw.type="password"; pw.placeholder="รหัสผ่าน";
  box.append(el("h1",null,"เข้าสู่ระบบครัว"), em, pw, msg);
  box.appendChild(btn("เข้าสู่ระบบ", async function(){
    var r = await sb.auth.signInWithPassword({email:em.value.trim(), password:pw.value});
    if (r.error) { msg.className="err"; msg.textContent="อีเมลหรือรหัสผ่านไม่ถูกต้อง"; } else kitchenBoard();
  }));
  app.appendChild(box);
}
var NEXT = {new:["making","เริ่มทำ"], making:["done","เสร็จแล้ว"]};
var LABEL = {new:"รอทำ", making:"กำลังทำ", done:"เสร็จแล้ว"};
async function kitchenBoard(){
  app.textContent = "";
  var top = el("div","top"); top.appendChild(el("h1",null,"หน้าครัว"));
  top.appendChild(btn("ออกจากระบบ", async function(){await sb.auth.signOut();location.reload()},"chip"));
  var list = el("div"); app.append(top, list);

  async function load(){
    var since = new Date(Date.now()-24*3600*1000).toISOString();
    var r = await sb.from("orders").select("*").gte("created_at",since).order("created_at",{ascending:false});
    list.textContent = "";
    if (r.error) { list.appendChild(el("div","err","โหลดออเดอร์ไม่ได้ ลองล็อกอินใหม่")); return; }
    if (!r.data.length) { list.appendChild(el("div","empty","ยังไม่มีออเดอร์")); return; }
    r.data.forEach(function(o){
      var d = el("div","order "+o.status), ul = el("ul"), total = 0;
      d.appendChild(el("h3",null,"โต๊ะ "+o.table_no+" · "+LABEL[o.status]));
      o.items.forEach(function(i){ul.appendChild(el("li",null,i.name+" × "+i.qty));total+=i.qty*i.price});
      d.append(ul, el("div",null,"รวม "+total+" บาท"));
      if (o.note) d.appendChild(el("div","note","หมายเหตุ: "+o.note));
      var a = el("div","acts");
      if (NEXT[o.status]) a.appendChild(btn(NEXT[o.status][1], async function(){
        await sb.from("orders").update({status:NEXT[o.status][0]}).eq("id",o.id); load();
      }));
      a.appendChild(btn("ลบ", async function(){ if(confirm("ลบออเดอร์นี้?")){await sb.from("orders").delete().eq("id",o.id);load()} }));
      d.appendChild(a); list.appendChild(d);
    });
  }
  await load();
  sb.channel("orders-live").on("postgres_changes",{event:"*",schema:"public",table:"orders"},load).subscribe();
}
</script>
</body>
</html>
